<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shouldn't it be rice??</title>

<!-- Pet Sounds-style font -->
<link href="https://fonts.googleapis.com/css2?family=Cooper+Black&display=swap" rel="stylesheet">

<style>
  @font-face {
  font-family: "Cooper Black";
  src: url("cooper-black.woff2") format("woff2"),
       url("cooper-black.woff") format("woff");
  font-weight: normal;
  font-style: normal;
}
  :root {
    --ink: #2E5A32;          /* Pet Sounds forest green */
    --muted: #5A4A3A;        /* warm brown */
    --accent: #C7D36F;       /* yellow-green */
    --accent-dark: #A8B85A;  /* darker yellow-green */
    --accent-2: #F2C94C;     /* golden yellow */
    --accent-2-dark: #D4A93E;
    --shadow: 0 10px 30px rgba(46, 90, 50, 0.18);
    --cream: #FFF8E1;        /* Pet Sounds cream */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--cream);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .app {
    width: 100%;
    max-width: 480px;
    text-align: center;
  }

  .eyebrow {
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--accent-dark);
    font-weight: 700;
    margin-bottom: 6px;
    position: relative;
    z-index: 2;
  }

  h1 {
    font-family: "Cooper Black", serif;
    font-weight: 900; /* force heavy bold */
    font-size: clamp(64px, 14vw, 88px);
    margin: 0 0 24px;
    line-height: 1.15;
    color: var(--ink);
    text-shadow: 4px 4px var(--accent-2);
    position: relative;
    z-index: 2;
  }

  .card {
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 32px 24px;
    position: relative;
    overflow: hidden;
    background-image: url('0.jpg');
    background-size: cover;
    background-position: center;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(255, 248, 225, 0.75); /* Pet Sounds cream overlay */
    z-index: 1;
  }

  .card > * {
    position: relative;
    z-index: 2;
  }

  .result {
    font-size: clamp(26px, 7vw, 34px);
    font-weight: 700;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.25s ease, opacity 0.25s ease;
    color: var(--ink);
  }

  .result.placeholder {
    color: var(--muted);
    font-weight: 400;
    font-size: 18px;
  }

  .result.pop {
    animation: pop 0.35s ease;
  }

  @keyframes pop {
    0% { transform: scale(0.85); opacity: 0; }
    60% { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); }
  }

  .result.spinning {
    animation: wheelSpin 0.09s linear infinite;
    color: var(--muted);
  }

  @keyframes wheelSpin {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(3deg) scale(1.03); }
    100% { transform: rotate(0deg) scale(1); }
  }

  .character {
    font-size: 40px;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 4px;
  }

  .character.pop {
    animation: pop 0.35s ease;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-top: 26px;
  }

  button {
    border: none;
    border-radius: 999px;
    padding: 13px 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    color: #fff;
  }

  button:active {
    transform: translateY(1px) scale(0.98);
  }

  #pickBtn, #againBtn {
    background: var(--accent);
    box-shadow: 0 6px 16px rgba(199, 211, 111, 0.35);
  }
  #pickBtn:hover, #againBtn:hover { background: var(--accent-dark); }

  #calorieBtn, #crazyBtn {
    background: var(--accent-2);
    box-shadow: 0 6px 16px rgba(242, 201, 76, 0.30);
  }
  #calorieBtn:hover, #crazyBtn:hover { background: var(--accent-2-dark); }

  footer {
    margin-top: 22px;
    font-size: 13px;
    color: var(--muted);
    position: relative;
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="app">
    <div class="eyebrow">Yeah... i have an eating disorder....</div>
    <h1>Shouldn't it be rice???</h1>

    <div class="card">
      <div id="result" class="result placeholder">God forbid a white boy get a lil dinner</div>
      <div id="character" class="character"></div>

      <div class="actions">
        <button id="pickBtn">Jesus take the wheel</button>
        <button id="calorieBtn">🏃 I have a calorie goal</button>
        <button id="crazyBtn">😂 Is that crazy?!</button>
      </div>
    </div>

    <footer>For when you fear you've lost the plot.</footer>
  </div>

<script>
  const STORAGE_KEY = "dinnerOptions";
  
  const calorieGoal = [
    "IN N OUT",
    "The Habit",
    "Burmese",
    "Chitas",
    "Taqueria Jalisco",
    "Mendocino Farms",
    "Sweetgreen",
    "Shake Shack",
    "McDonalds",
    "Chipotle",
    "Jimboys",
    "Taco Bell"
  ];

  const crazyOptions = [
    "Hawaiian (JJ's)",
    "Panda Express",
    "Willie's",
    "Okie Dokies",
    "Sushi (Mikunis, Noaki, Fuji)",
    "Del Taco",
    "Tres Hermanas",
    "Tacos 65"
  ];

  const defaultDinners = [
    ...calorieGoal.map(name => ({ name, category: "calorie" })),
    ...crazyOptions.map(name => ({ name, category: "crazy" }))
  ];

  function loadDinners() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(saved) && saved.length > 0) {
        return saved;
      }
    } catch (e) {}
    return defaultDinners.map((d) => ({ ...d }));
  }

  let dinners = loadDinners();

  function saveDinners() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(dinners));
  }

  const resultEl = document.getElementById("result");
  const characterEl = document.getElementById("character");

  const HEALTHY_CHARACTER = "🏃‍♂️✨";
  const LESS_HEALTHY_CHARACTER = "😂🍔";
  const SPIN_DURATION_MS = 900;
  const SPIN_FLIP_MS = 90;

  function pickDinner(filterCategory = null) {
    if (dinners.length === 0) {
      resultEl.classList.remove("pop", "spinning");
      resultEl.classList.add("placeholder");
      resultEl.textContent = "No options available!";
      characterEl.textContent = "";
      return;
    }

    let filteredDinners = dinners;
    if (filterCategory !== null) {
      filteredDinners = dinners.filter((d) => d.category === filterCategory);
      if (filteredDinners.length === 0) {
        resultEl.classList.remove("pop", "spinning");
        resultEl.classList.add("placeholder");
        resultEl.textContent = filterCategory === "calorie" ? "No calorie options!" : "No crazy options!";
        characterEl.textContent = "";
        return;
      }
    }

    const finalChoice = filteredDinners[Math.floor(Math.random() * filteredDinners.length)];

    resultEl.classList.remove("placeholder", "pop");
    characterEl.classList.remove("pop");
    resultEl.classList.add("spinning");
    characterEl.textContent = "";

    const spinInterval = setInterval(() => {
      const flash = filteredDinners[Math.floor(Math.random() * filteredDinners.length)];
      resultEl.textContent = flash.name;
    }, SPIN_FLIP_MS);

    setTimeout(() => {
      clearInterval(spinInterval);
      resultEl.classList.remove("spinning");
      void resultEl.offsetWidth;
      resultEl.textContent = finalChoice.name;
      resultEl.classList.add("pop");
      characterEl.textContent = finalChoice.category === "calorie"
        ? HEALTHY_CHARACTER
        : LESS_HEALTHY_CHARACTER;
      characterEl.classList.add("pop");
    }, SPIN_DURATION_MS);
  }

  document.getElementById("pickBtn").onclick = () => pickDinner();
  document.getElementById("againBtn").onclick = () => pickDinner();
  document.getElementById("calorieBtn").onclick = () => pickDinner("calorie");
  document.getElementById("crazyBtn").onclick = () => pickDinner("crazy");
</script>
</body>
</html>
