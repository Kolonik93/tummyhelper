<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shouldn't it be rice??</title>

<!-- Chivo for eyebrow header -->
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@700&display=swap" rel="stylesheet">

<style>
  @font-face {
    font-family: "Cooper Black";
    src: url("cooper-black.woff2") format("woff2"),
         url("cooper-black.woff") format("woff");
    font-weight: normal;
    font-style: normal;
  }

  :root {
    --ink: #2E5A32;
    --muted: #5A4A3A;
    --accent: #C7D36F;
    --accent-dark: #A8B85A;
    --accent-2: #F2C94C;
    --accent-2-dark: #D4A93E;
    --shadow: 0 10px 30px rgba(46, 90, 50, 0.18);
    --cream: #FFF8E1;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--cream);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .app {
    width: 100%;
    max-width: 480px;
    text-align: center;
  }

  /* Eyebrow header using Chivo with outline */
  .eyebrow {
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 24px;
    color: var(--accent-dark);
    font-weight: 700;
    margin-bottom: 6px;
    font-family: "Chivo", sans-serif;
    text-shadow:
      -2px -2px 0 black,
       2px -2px 0 black,
      -2px  2px 0 black,
       2px  2px 0 black;
  }

  /* Main Pet Sounds-style header using Cooper Black */
  h1 {
    font-family: "Cooper Black", serif;
    font-weight: 900;
    font-size: clamp(64px, 14vw, 88px);
    margin: 0 0 24px;
    line-height: 1.15;
    color: var(--ink);
    text-shadow:
      -3px -3px 0 black,
       3px -3px 0 black,
      -3px  3px 0 black,
       3px  3px 0 black;
  }

  .card {
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 32px 24px;
    position: relative;
    overflow: hidden;
    background-image: url('0.jpg');
    background-size: cover;
    background-position: center;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255, 248, 225, 0.75);
  }

  .card > * { position: relative; }

  .result {
    font-size: clamp(26px, 7vw, 34px);
    font-weight: 700;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.25s ease, opacity 0.25s ease;
    color: var(--ink);
  }

  .result.placeholder {
    color: var(--muted);
    font-weight: 400;
    font-size: 18px;
  }

  .result.pop {
    animation: pop 0.35s ease;
  }

  @keyframes pop {
    0% { transform: scale(0.85); opacity: 0; }
    60% { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); }
  }

  .result.spinning {
    animation: wheelSpin 0.09s linear infinite;
    color: var(--muted);
  }

  @keyframes wheelSpin {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(3deg) scale(1.03); }
    100% { transform: rotate(0deg) scale(1); }
  }

  .character {
    font-size: 40px;
    min-height: 48px;
    margin-top: 4px;
  }

  .character.pop {
    animation: pop 0.35s ease;
  }

  .calories {
    margin-top: 4px;
    font-size: 16px;
    font-weight: 400;
    color: var(--muted);
  }

  .actions {
    display: flex;
    justify-content: center;
    margin-top: 26px;
  }

  button {
    border: none;
    border-radius: 999px;
    padding: 13px 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    color: #fff;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  button:active {
    transform: translateY(1px) scale(0.98);
  }

  #crazyBtn {
    background: var(--accent-2);
    box-shadow: 0 6px 16px rgba(242, 201, 76, 0.30);
  }
  #crazyBtn:hover { background: var(--accent-2-dark); }

  footer {
    margin-top: 22px;
    font-size: 13px;
    color: var(--muted);
  }

  .danger {
    animation: dangerPulse 0.6s ease-in-out 3;
    color: #B00020;
  }

  @keyframes dangerPulse {
    0%   { transform: scale(1); color: #B00020; }
    25%  { transform: scale(1.15); color: #ff3b3b; }
    50%  { transform: scale(0.9); color: #B00020; }
    75%  { transform: scale(1.15); color: #ff3b3b; }
    100% { transform: scale(1); color: #B00020; }
  }

  .danger-flash {
    animation: flashBG 0.15s alternate 10;
  }

  @keyframes flashBG {
    0%   { background-color: rgba(255, 0, 0, 0.25); }
    100% { background-color: rgba(255, 255, 255, 0.25); }
  }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }

  .modal-content {
    background: #FFF8E1;
    padding: 24px;
    border-radius: 16px;
    text-align: center;
    box-shadow: var(--shadow);
  }

  .modal-content p {
    font-size: 20px;
    margin-bottom: 16px;
  }

  .modal-content button {
    margin: 0 8px;
    padding: 10px 18px;
    border-radius: 999px;
    border: none;
    font-weight: 600;
    cursor: pointer;
  }

  .yes { background: var(--accent); }
  .no { background: var(--accent-2); }

  #history {
    margin-top: 40px;
    text-align: left;
  }

  #history h2 {
    font-family: "Cooper Black";
    font-size: 28px;
    margin-bottom: 12px;
  }

  .bar {
    height: 22px;
    background: var(--accent);
    margin: 6px 0;
    border-radius: 6px;
    transition: width 0.3s ease;
  }

  .bar-label {
    font-size: 14px;
    margin-bottom: 2px;
  }
</style>
</head>
<body>
  <div class="app">
    <div class="eyebrow">Yeah... i have an eating disorder....</div>

    <h1>Shouldn't it be rice???</h1>

    <div class="card">
      <div id="result" class="result placeholder">God forbid a white boy get a lil dinner</div>
      <div id="character" class="character"></div>
      <div id="calories" class="calories"></div>

      <div class="actions">
        <button id="crazyBtn">😂 Is that crazy?!</button>
      </div>
    </div>

    <div id="history">
      <h2>History</h2>
      <div id="graph"></div>
    </div>

    <footer>For when you fear you've lost the plot.</footer>
  </div>

  <div id="confirmModal" class="modal">
    <div class="modal-content">
      <p>Select for dinner?</p>
      <button id="yesBtn" class="yes">Yes</button>
      <button id="noBtn" class="no">No</button>
    </div>
  </div>

<script>
  const calorieGoal = [
    { name: "IN N OUT", calories: 850, category: "calorie" },
    { name: "The Habit", calories: 700, category: "calorie" },
    { name: "Burmese", calories: 650, category: "calorie" },
    { name: "Chitas", calories: 600, category: "calorie" },
    { name: "Taqueria Jalisco", calories: 750, category: "calorie" },
    { name: "Mendocino Farms", calories: 550, category: "calorie" },
    { name: "Sweetgreen", calories: 480, category: "calorie" },
    { name: "Shake Shack", calories: 820, category: "calorie" },
    { name: "McDonalds", calories: 650, category: "calorie" },
    { name: "Chipotle", calories: 720, category: "calorie" },
    { name: "Jimboys", calories: 780, category: "calorie" },
    { name: "Taco Bell", calories: 680, category: "calorie" }
  ];

  const crazyOptions = [
    { name: "Hawaiian (JJ's)", calories: 1100, category: "crazy" },
    { name: "Panda Express", calories: 900, category: "crazy" },
    { name: "Willie's", calories: 950, category: "crazy" },
    { name: "Okie Dokies", calories: 1000, category: "crazy" },
    { name: "Sushi (Mikunis, Noaki, Fuji)", calories: 650, category: "crazy" },
    { name: "Del Taco", calories: 850, category: "crazy" },
    { name: "Tres Hermanas", calories: 1050, category: "crazy" },
    { name: "Tacos 65", calories: 900, category: "crazy" }
  ];

  const defaultDinners = [...calorieGoal, ...crazyOptions];

  const resultEl = document.getElementById("result");
  const characterEl = document.getElementById("character");
  const caloriesEl = document.getElementById("calories");

  const confirmModal = document.getElementById("confirmModal");
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");

  const dangerSound = new Audio("danger.mp3");

  const graphEl = document.getElementById("graph");

  const HEALTHY_CHARACTER = "🏃‍♂️✨";
  const LESS_HEALTHY_CHARACTER = "😂🍔";
  const SPIN_DURATION_MS = 900;
  const SPIN_FLIP_MS = 90;

  let history = JSON.parse(localStorage.getItem("history")) || {};

  function saveHistory() {
    localStorage.setItem("history", JSON.stringify(history));
  }

  function logSelection(name) {
    const today = new Date().toISOString().split("T")[0];

    if (!history[name]) {
      history[name] = { count: 1, lastSelected: today };
    } else {
      history[name].count++;
      history[name].lastSelected = today;
    }

    saveHistory();
    renderGraph();
  }

  function renderGraph() {
    graphEl.innerHTML = "";

    const entries = Object.entries(history).sort((a, b) => b[1].count - a[1].count);

    entries.forEach(([name, data]) => {
      const label = document.createElement("div");
      label.className = "bar-label";
      label.textContent = `${name} — ${data.count} times (last: ${data.lastSelected})`;

      const bar = document.createElement("div");
      bar.className = "bar";
      bar.style.width = `${Math.min(data.count * 20, 300)}px`;

      graphEl.appendChild(label);
      graphEl.appendChild(bar);
    });
  }

  renderGraph();

  function pickDinner() {
    const filtered = defaultDinners;
    const finalChoice = filtered[Math.floor(Math.random() * filtered.length)];

    resultEl.classList.remove("placeholder", "pop", "danger");
    characterEl.classList.remove("pop");
    caloriesEl.classList.remove("danger");
    caloriesEl.textContent = "";

    resultEl.classList.add("spinning");

    const spinInterval = setInterval(() => {
      const flash = filtered[Math.floor(Math.random() * filtered.length)];
      resultEl.textContent = flash.name;
    }, SPIN_FLIP_MS);

    setTimeout(() => {
      clearInterval(spinInterval);
      resultEl.classList.remove("spinning");
      void resultEl.offsetWidth;

      resultEl.textContent = finalChoice.name;
      resultEl.classList.add("pop");

      characterEl.textContent =
        finalChoice.category === "calorie"
          ? HEALTHY_CHARACTER
          : LESS_HEALTHY_CHARACTER;
      characterEl.classList.add("pop");

      caloriesEl.textContent = `${finalChoice.calories} calories`;

      confirmModal.style.display = "flex";

      yesBtn.onclick = () => {
        confirmModal.style.display = "none";

        if (finalChoice.calories > 1000) {
          dangerSound.currentTime = 0;
          dangerSound.play();

          document.querySelector(".card").classList.add("danger-flash");
          resultEl.classList.add("danger");
          caloriesEl.classList.add("danger");

          setTimeout(() => {
            document.querySelector(".card").classList.remove("danger-flash");
          }, 1500);
        }

        logSelection(finalChoice.name);
      };

      noBtn.onclick = () => {
        confirmModal.style.display = "none";
        resultEl.classList.remove("danger");
        caloriesEl.classList.remove("danger");
      };

    }, SPIN_DURATION_MS);
  }

  document.getElementById("crazyBtn").onclick = () => pickDinner();
</script>
</body>
</html>
